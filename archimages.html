      top: 5.5rem;
      right: 1.25rem;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      height: auto;

      line-height: 1;

      background: transparent;
      border: none;
      border-radius: 0;
      text-decoration: none;

      padding: 0;
      margin-left: auto;
      pointer-events: auto;
    }

    .page-close:hover,
    .page-close:focus-visible {
      color: #b7d3ff;
      transform: translateY(-1px);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 32, 0.9);
      z-index: 100;
      padding: 4rem 2rem 2rem;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-inner {
      position: relative;
      width: min(90vw, 1200px);
      max-height: calc(100vh - 6rem);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-image {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 8rem);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 0.5rem;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      background: #2f3a3f;
    }

    .lightbox-caption {
      margin-top: 0.5rem;
      text-align: right;
      color: #dfeaf8;
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.9;
      width: 100%;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #dfeaf8;
      background: rgba(47, 58, 63, 0.45);
      border: none;
      border-radius: 0;
      width: 2.75rem;
      height: 2.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      line-height: 1;
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease;
      box-shadow: none;
      padding: 0;
    }

    .lightbox-nav:hover,
    .lightbox-nav:focus-visible {
      background: rgba(47, 58, 63, 0.7);
      color: #b7d3ff;
    }

    .lightbox-prev {
      left: 0.5rem;
    }

    .lightbox-next {
      right: 0.5rem;
    }

    .lightbox-close {
      position: absolute;
      top: -2.75rem;
      right: -0.25rem;
      color: #dfeaf8;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      background: transparent;
      border: none;
    }

    .lightbox-close:hover,
    .lightbox-close:focus-visible {
      color: #b7d3ff;
    }

    @media (max-width: 768px) {
      .lightbox {
        padding: 4rem 1rem 1rem;
      }

      .lightbox-prev {
        left: 0.5rem;
      }

      .lightbox-next {
        right: 0.5rem;
      }

      .lightbox-inner {
        width: 100%;
      }
    }
  </style>

<body class="bg-[#2f3a3f] text-[#dfeaf8] font-body selection:bg-[#cfe0ff] selection:text-[#2f3a3f] flex flex-col min-h-screen pb-20">

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="lightbox-inner">
      <button type="button" class="lightbox-close" aria-label="Close image">×</button>
      <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous image">‹</button>
      <div class="flex flex-col items-center">
        <img id="lightbox-image" class="lightbox-image" src="" alt="" />
        <div id="lightbox-caption" class="lightbox-caption" aria-live="polite"></div>
      </div>
      <button type="button" class="lightbox-nav lightbox-next" aria-label="Next image">›</button>
    </div>

  <script>
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('nav a[href]').forEach((link) => {
      const href = link.getAttribute('href');
      if (href && href === currentPage) {
        link.classList.add('current-page');
      } else {
        link.classList.remove('current-page');
      }
    });

    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if (mobileMenuBtn && mobileMenu) {
      mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
      });
    }

    let images = [];
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const closeButton = document.querySelector('.lightbox-close');
    const prevButton = document.querySelector('.lightbox-prev');
    const nextButton = document.querySelector('.lightbox-next');
    const galleryGrid = document.getElementById('gallery-grid');
    let currentImageIndex = -1;

    async function loadAndRenderGallery() {
      try {
        const response = await fetch('images/arch/manifest.json');
        const imageData = await response.json();

        galleryGrid.innerHTML = '';
        images = [];

        imageData.forEach((item, index) => {
          const img = document.createElement('img');
          img.className = 'gallery-image w-full h-72 object-cover rounded-lg border border-[#3f4d53] shadow-lg cursor-pointer';
          img.src = item.src;
          img.alt = item.alt;
          img.dataset.index = index;
          img.title = item.alt;
          galleryGrid.appendChild(img);
          images.push(img);
        });

        attachGalleryEventListeners();
      } catch (error) {
        console.error('Failed to load gallery manifest:', error);
        galleryGrid.innerHTML = '<p class="text-slate-400">Unable to load gallery</p>';
      }
    }

    function attachGalleryEventListeners() {
      images.forEach((image) => {
        image.addEventListener('click', () => {
          openLightbox(Number(image.dataset.index));
        });
      });
    }

    loadAndRenderGallery();

    function readExifAsciiString(dataView, offset, length) {
      const bytes = [];
      for (let i = 0; i < length; i += 1) {
        const byte = dataView.getUint8(offset + i);
        if (byte === 0) break;
        bytes.push(String.fromCharCode(byte));
      }
      return bytes.join('');
    }

    function getExifImageDescription(arrayBuffer) {
      const dataView = new DataView(arrayBuffer);
      if (dataView.getUint16(0, false) !== 0xFFD8) {
        return '';
      }

      let offset = 2;
      while (offset + 1 < dataView.byteLength) {
        const marker = dataView.getUint16(offset, false);
        offset += 2;

        if (marker === 0xFFE1) {
          const segmentLength = dataView.getUint16(offset, false);
          offset += 2;
          const segmentStart = offset;
          const segmentEnd = segmentStart + segmentLength - 2;

          if (segmentEnd > dataView.byteLength) {
            return '';
          }

          const exifHeader = Array.from(new Uint8Array(arrayBuffer, segmentStart, 6))
            .map((byte) => String.fromCharCode(byte))
            .join('');

          if (exifHeader === 'Exif\0\0') {
            const tiffOffset = segmentStart + 6;
            const littleEndian = dataView.getUint16(tiffOffset, false) === 0x4949;
            const ifdOffset = dataView.getUint32(tiffOffset + 4, littleEndian);
            const numEntries = dataView.getUint16(tiffOffset + ifdOffset, littleEndian);

            let entryOffset = tiffOffset + ifdOffset + 2;
            for (let i = 0; i < numEntries; i += 1) {
              const tag = dataView.getUint16(entryOffset, littleEndian);
              const type = dataView.getUint16(entryOffset + 2, littleEndian);
              const count = dataView.getUint32(entryOffset + 4, littleEndian);

              if (tag === 0x010e && type === 2) {
                const valueOffset = dataView.getUint32(entryOffset + 8, littleEndian);
                const valuePosition = tiffOffset + valueOffset;
                return readExifAsciiString(dataView, valuePosition, count);
              }

              entryOffset += 12;
            }
          }

          offset = segmentEnd;
          continue;
        }

        if (marker === 0xFFD9 || marker === 0xFFDA) {
          break;
        }

        if (offset + 2 > dataView.byteLength) {
          break;
        }

        const sectionLength = dataView.getUint16(offset, false);
        offset += sectionLength;
      }

      return '';
    }

    async function loadImageDescription(image) {
      if (image.dataset.description || image.dataset.descriptionLoaded === 'true') {
        return image.dataset.description || '';
      }

      try {
        const response = await fetch(image.src, { cache: 'force-cache' });
        const arrayBuffer = await response.arrayBuffer();
        const description = getExifImageDescription(arrayBuffer);
        image.dataset.description = description || image.alt || '';
      } catch (error) {
        image.dataset.description = image.alt || '';
      }

      image.dataset.descriptionLoaded = 'true';
      return image.dataset.description;
    }

    function getImageDescription(image) {
      return image.dataset.description || image.title || image.alt || 'Architectural image';
    }

    async function openLightbox(index) {
      currentImageIndex = index;
      const image = images[index];
      if (!image) return;

      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;

      const description = await loadImageDescription(image);
      if (currentImageIndex === index) {
        lightboxCaption.textContent = description || getImageDescription(image);
      }

      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      currentImageIndex = -1;
    }

    function moveLightbox(step) {
      if (currentImageIndex === -1 || !images.length) return;
      const nextIndex = (currentImageIndex + step + images.length) % images.length;
      openLightbox(nextIndex);
    }

    closeButton.addEventListener('click', closeLightbox);
    prevButton.addEventListener('click', () => {
      if (currentImageIndex !== -1) {
        moveLightbox(-1);
      }
    });
    nextButton.addEventListener('click', () => {
      if (currentImageIndex !== -1) {
        moveLightbox(1);
      }
    });

    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (!lightbox.classList.contains('open')) return;
      if (event.key === 'Escape') {
        closeLightbox();
      }
      if (event.key === 'ArrowLeft') {
        moveLightbox(-1);
      }
      if (event.key === 'ArrowRight') {
        moveLightbox(1);
      }
    });
  </script>
