    }

    body .text-slate-400,
    body .text-slate-500,
    body .text-slate-600,
    body .text-slate-700,
    body .text-slate-900,
    body .text-slate-100,
    body .text-slate-50 {
      color: #dfeaf8 !important;
    }

    body .hover\:text-slate-600:hover,
    body .hover\:text-slate-700:hover,
    body .hover\:text-slate-900:hover {
      color: #b7d3ff !important;
    }

    :root {
      --plyr-color-main: #dfeaf8;
      --plyr-control-color: #dfeaf8;
      --plyr-control-color-hover: #dfeaf8;
      --plyr-control-background: transparent;
      --plyr-control-background-hover: transparent;
      --plyr-range-fill-background: #dfeaf8;
      --plyr-range-track-background: #2f3a3f;
      --plyr-range-thumb-background: #dfeaf8;
      --plyr-video-background: #2f3a3f;
      --plyr-menu-background: #2f3a3f;
    }

    .plyr--video .plyr__controls {
      background: linear-gradient(180deg, rgba(47, 58, 63, 0) 0%, rgba(47, 58, 63, 0.55) 100%) !important;
      box-shadow: none;
      opacity: 0;
      transition: opacity 180ms ease;
      pointer-events: none;
    }

    .plyr--video:hover .plyr__controls,
    .plyr--video.plyr--hover .plyr__controls,
    .plyr--video.plyr--fullscreen .plyr__controls {
      opacity: 1;
      pointer-events: auto;
    }

    .plyr__control {
      background: transparent !important;
      color: #dfeaf8 !important;
      transform: scale(0.95);
      transform-origin: center;
    }

    .plyr__control svg {
      fill: currentColor;
      width: 1.05em;
      height: 1.05em;
    }

    .plyr__control--overlaid,
    .plyr__control[data-plyr="play"],
    .plyr__control[data-plyr="pause"] {
      color: #dfeaf8 !important;
      background: transparent !important;
    }

    .plyr__control--overlaid {
      display: none !important;
    }

    .video-overlay-play {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      width: 6rem;
      height: 6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #2f3a3f;
      border: none;
      padding: 0;
      cursor: pointer;
      z-index: 2;
      pointer-events: auto;
      opacity: 1;
      transition: opacity 180ms ease;
    }

    .video-overlay-play.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .video-overlay-play svg {
      width: 3.75rem;
      height: 3.75rem;
      fill: currentColor;
    }

    .plyr__progress__buffer,
    .plyr__progress__played,
    .plyr__volume__display {
      color: #dfeaf8 !important;
      background-color: #dfeaf8 !important;
    }

    .plyr__progress,
    .plyr__volume {
      height: 0.35rem !important;
      min-height: 0.35rem !important;
    }

    .plyr__progress input[type="range"],
    .plyr__volume input[type="range"] {
      accent-color: #dfeaf8;
      height: 0.35rem !important;
      min-height: 0.35rem !important;
    }

    .plyr__time,
    .plyr__time + .plyr__time {
      color: #dfeaf8 !important;
      background: transparent !important;
      padding: 0 !important;
    }
    .video-shell {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: calc(100vh - var(--nav-height, 0px) - var(--footer-height, 0px));
    }

    .video-header {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      margin-bottom: 0.5rem;
      pointer-events: none;
    }

    /* Video fills available viewport height and scales by height (no stretching) */
    .video-fill {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--nav-height, 0px) - var(--footer-height, 0px) - 3.25rem);
      overflow: hidden;
      background: #2f3a3f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-close {
      position: fixed;
      top: 5.5rem;
      right: 1.25rem;
      z-index: 60;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      height: auto;
      font-size: 2rem;
      line-height: 1;
      color: #dfeaf8;
      background: transparent;
      border: none;
      border-radius: 0;
      text-decoration: none;
      transition: color 180ms ease, transform 180ms ease;
      padding: 0;
      pointer-events: auto;
    }

    .page-close:hover,
    .page-close:focus-visible {
      color: #b7d3ff;
      transform: translateY(-1px);
    }

    /* The Plyr container will maintain a 16:9 box that is as tall as possible */
    .video-fill .plyr {
      height: 100% !important;
      max-height: 100% !important;
      aspect-ratio: 16/9;
      width: auto !important;
      max-width: 100%;
    }

    /* ensure controls are positioned relative to the plyr container */
    .video-fill .plyr {
      position: relative;
    }

    .video-fill .plyr__controls {
      position: absolute !important;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex !important;
      justify-content: center !important;
      transform: none !important;
      transform-origin: center bottom;
    }

    .video-fill .plyr__video-wrapper {
      height: 100% !important;
      max-height: 100% !important;
      overflow: hidden;
    }

    /* Video fills the 16:9 box while preserving aspect ratio (no cropping) */
    .video-fill video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      position: static !important;
      transform: none !important;
      display: block;
    }
  </style>
